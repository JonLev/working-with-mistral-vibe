# scripts/onboarding.yaml — routing spec for the personalized onboarding prompt
# (tools/onboarding-prompt.md).
#
# Hand-maintained INPUT to scripts/generate-reference.py, which validates every
# route stop (page exists, anchor resolves to a real heading) and embeds the
# result as the `onboarding:` section of machine-readable/reference.yaml.
# Editing the routes means editing this file and regenerating; the drift gate
# then fails until reference.yaml is regenerated, and a bad route fails the
# generator outright.
#
# Design notes:
# - Goals and tracks reuse the guide's own taxonomies: the tracks are the
#   learning-path tracks (Beginner / Practitioner / Production / Maintainer),
#   the goals map to guide areas. Nothing here invents mechanics; stops are
#   routing, `focus` lines are navigation text, not claims.
# - A route is goal -> track -> ordered stops. `all` applies to every track;
#   explicit track keys override it. Every goal must resolve for every track.
# - `anchor` values are GitHub-style heading slugs, validated at generation.

golden_rules:
  page: "guide/cheatsheet.md"
  anchor: "the-golden-rules"

goals:
  - id: "get_started"
    label: "Get started"
    ask: "New to the Vibe CLI; learn the essentials quickly"
  - id: "optimize"
    label: "Optimize"
    ask: "Using the CLI already; improve an existing workflow"
  - id: "build_agents"
    label: "Build agents and skills"
    ask: "Create custom agents, skills, and hooks"
  - id: "learn_security"
    label: "Security and production safety"
    ask: "Harden a setup, adopt for production"
  - id: "migrate_in"
    label: "Migrate from another agentic CLI"
    ask: "Arrive from a different tool; map what you know"
  - id: "adopt_team"
    label: "Adopt with a team"
    ask: "Roll out agentic coding to a team, with metrics and guardrails"
  - id: "fix_problem"
    label: "Fix a problem"
    ask: "Troubleshoot a specific issue right now"
  - id: "learn_everything"
    label: "Learn everything"
    ask: "Complete guided tour of the guide"

tracks:
  - id: "beginner"
    label: "Beginner"
    entry: "Day 1 with the Vibe CLI"
  - id: "practitioner"
    label: "Practitioner"
    entry: "Using the CLI 1-4 weeks"
  - id: "production"
    label: "Production"
    entry: "Running the CLI on real repositories, or for a team"
  - id: "maintainer"
    label: "Maintainer"
    entry: "Own the team's Vibe configuration"

