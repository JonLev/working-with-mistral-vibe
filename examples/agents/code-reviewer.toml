# Pair with prompts/code-reviewer.md, selected via system_prompt_id below.
agent_type = "subagent"
display_name = "Code Reviewer"
description = "Line-level code review: correctness, security (OWASP Top 10), performance, maintainability, test coverage, and silent-failure audit. Reports severity-classified findings with evidence; never edits files."
safety = "safe"
system_prompt_id = "code-reviewer"
enabled_tools = ["read_file", "grep", "bash"]

[tools.write_file]
permission = "never"

[tools.edit]
permission = "never"
